[package]
name = "monitor_sistema_per"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
sysinfo = "0.34.2"

serde = { version = "1.0", features = ["derive"] }

rusqlite = { version = "0.29", features = ["bundled"] } # Usa `bundled` para evitar instalar SQLite por separado

systemstat = "0.2"
netstat2 = "0.9"

